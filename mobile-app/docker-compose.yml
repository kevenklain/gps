services:
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile-app
    working_dir: /app
    ports:
      - "8081:8081"
    volumes:
      # Codigo fica editavel no host e recarrega no Expo/Metro.
      - .:/app
      # Evita que o node_modules do host sobrescreva o instalado no container.
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true
    command: ["npx", "expo", "start", "--tunnel"]

volumes:
  node_modules:
