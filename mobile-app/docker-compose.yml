services:
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile-app
    working_dir: /app
    ports:
      - "8081:8081"
    volumes:
      # Codigo fica editavel no host e recarrega no Expo/Metro.
      - .:/app
      # Evita que o node_modules do host sobrescreva o instalado no container.
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      # Por padrao, celular fisico e emuladores acessam a API pelo IP LAN do Mac.
      # Se o IP mudar, sobrescreva com EXPO_PUBLIC_API_URL no .env ou no terminal.
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://192.168.5.160:8000}
      # Forca os clientes Expo a enxergarem o Metro pelo IP LAN do Mac,
      # em vez do IP interno do container Docker.
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-http://192.168.5.160:8081}
    stdin_open: true
    tty: true
    command: ["npx", "expo", "start", "--lan"]

volumes:
  node_modules:
