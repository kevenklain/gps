services:
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile-app
    working_dir: /app
    ports:
      - "8081:8081"
    volumes:
      # Codigo fica editavel no host e recarrega no Expo/Metro.
      - .:/app
      # Evita que o node_modules do host sobrescreva o instalado no container.
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      # IP LAN atual do Mac para acesso pelo iPhone fisico.
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://192.168.1.18:8000}
      EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-http://192.168.1.18:8081}
    stdin_open: true
    tty: true
    command: ["npx", "expo", "start", "--lan"]

volumes:
  node_modules:
