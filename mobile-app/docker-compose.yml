services:
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobile-app
    working_dir: /app
    ports:
      - "8081:8081"
    volumes:
      # Codigo fica editavel no host e recarrega no Expo/Metro.
      - .:/app
      # Evita que o node_modules do host sobrescreva o instalado no container.
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      # O start-mobile.sh detecta o IP LAN atual do Mac para a API Laravel.
      # Se iniciar o Compose diretamente, a variavel pode ser informada manualmente.
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    stdin_open: true
    tty: true
    # O tunnel permite abrir o projeto no Expo Go mesmo quando a rede bloqueia
    # comunicacao direta entre o iPhone e o computador.
    command: ["npx", "expo", "start", "--tunnel", "--go"]

volumes:
  node_modules:
